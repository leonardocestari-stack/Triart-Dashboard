<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f3f5f5; --card:#fff; --ink:#1a1a1a; --mute:#666b6b; --line:#e2e6e6;
    --brand:#127a68; --brand-logo:#1ba089; --ok:#127a68; --bad:#c2410c; --okbg:#e0f4f0; --badbg:#fdeee6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);border-top:4px solid var(--brand-logo);position:sticky;top:0;z-index:10}
  .marca{display:flex;align-items:center;gap:12px}
  .marca img{height:52px;width:52px;display:block}
  .marca .sub{font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
  .top{max-width:1200px;margin:0 auto;padding:10px 20px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h1{font-size:18px;margin:0;font-weight:650}
  .ref{color:var(--mute);font-size:13px} .ref b{color:var(--ink)}
  .top .ref{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sync-st{font-size:12px}
  .sync-st.err{color:var(--bad)} .sync-st.ok{color:var(--ok)}
  .sync-btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600}
  .sync-btn:hover{filter:brightness(1.1)} .sync-btn:disabled{opacity:.6;cursor:progress}
  .sync-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sync-btn.girando svg{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  #filtros{background:var(--card);border-bottom:1px solid var(--line)}
  #filtros .in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:13px;color:var(--mute)}
  #filtros .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #filtros .grp>b{color:var(--ink);font-weight:600}
  #filtros select{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  #filtros button{font:inherit;font-size:12.5px;color:var(--brand);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
  #filtros button:hover{border-color:var(--brand)}
  body.bloq header, body.bloq #filtros, body.bloq #aviso, body.bloq main{display:none}
  #login{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;padding:20px;overflow:auto}
  body.bloq #login{display:flex}
  .lg{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand-logo);border-radius:14px;padding:28px 26px;text-align:center}
  .lg img{width:84px;height:84px}
  .lg h2{margin:10px 0 4px;font-size:18px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .lg p{margin:0 0 16px;color:var(--mute);font-size:13.5px}
  .lg input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff;color:var(--ink)}
  .lg input:focus{outline:2px solid var(--brand-logo);outline-offset:0;border-color:var(--brand-logo)}
  .lg #lgCodeIn{text-align:center;letter-spacing:.5em;font-size:24px;font-weight:700}
  .lg button{width:100%;font:inherit;font-size:14.5px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff}
  .lg button:hover:not(:disabled){filter:brightness(1.1)} .lg button:disabled{opacity:.55;cursor:default}
  .lg button.sec{background:none;color:var(--brand);border-color:var(--line);margin-top:8px}
  .lg-msg{min-height:20px;margin-top:12px;font-size:13px}
  .lg-msg.err{color:var(--bad)} .lg-msg.ok{color:var(--ok)}
  .quem{font-size:12px;color:var(--mute)}
  .sair{font:inherit;font-size:12.5px;color:var(--brand);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
  .sair:hover{border-color:var(--brand)}
  .ac .hint{color:var(--mute);font-size:13px;margin:0 0 12px}
  .ac .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .ac table{width:100%;border-collapse:collapse}
  .ac th,.ac td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
  .ac tr:last-child td{border-bottom:0}
  .ac th:first-child,.ac td:first-child{text-align:left}
  .ac th{color:var(--mute);font-weight:600;font-size:12.5px}
  .ac input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand-logo)}
  .ac .tag{background:var(--okbg);color:var(--ok);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;margin-left:6px}
  .ac .rm{font:inherit;font-size:12.5px;color:var(--bad);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
  .ac form{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .ac form input[type=email]{flex:1 1 220px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  .ac form label{display:flex;align-items:center;gap:6px;font-size:14px}
  .ac .pri{font:inherit;font-weight:600;color:#fff;background:var(--brand);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
  .ac-st{min-height:20px;margin-top:10px;font-size:13px} .ac-st.ok{color:var(--ok)} .ac-st.err{color:var(--bad)}
  .lg .tabs{display:flex;gap:6px;margin-bottom:12px}
  .lg .tabs button{margin:0;background:none;color:var(--mute);border:1px solid var(--line);font-size:14px;padding:9px}
  .lg .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .lg input[hidden]{display:none}
  .lg #lgPendente b{color:var(--ink);word-break:break-all}
  .ac tr.pend td:first-child{font-weight:600}
  .ac .tag.pend{background:#fff4d6;color:#8a6100}
  .ac .acoes{white-space:nowrap}
  .ac .sen{font:inherit;font-size:12.5px;color:var(--brand);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;margin-right:4px}
  .ac .sen:hover{border-color:var(--brand)}
  #nav button{position:relative}
  #nav button .cad{display:none;position:absolute;top:3px;right:8px;width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center}
  #nav button .cad svg{width:10px;height:10px;stroke:var(--mute);stroke-width:2.4}
  #nav button.lock{color:#a3aaaa}
  #nav button.lock .cad{display:flex}
  #nav button.lock.on{color:var(--mute);border-color:var(--line)}
  .bloqueado{max-width:420px;margin:60px auto;text-align:center;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 24px}
  .bloqueado svg{width:44px;height:44px;fill:none;stroke:var(--mute);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .bloqueado h3{margin:12px 0 6px;color:var(--ink);font-size:17px}
  .bloqueado p{margin:0;font-size:14px}
  .badge-demo{background:#fff4d6;color:#8a6100;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:8px}
  nav{max-width:1200px;margin:0 auto;padding:6px 12px 0;display:flex;gap:4px;overflow-x:auto}
  nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 18px 10px;color:var(--mute);font-size:12.5px;border-bottom:3px solid transparent;white-space:nowrap}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--brand);border-color:var(--brand-logo);font-weight:600}
  nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  main{max-width:1200px;margin:0 auto;padding:20px}
  #aviso{max-width:1200px;margin:12px auto 0;padding:0 20px}
  #aviso div{background:#fff4d6;color:#8a6100;border-radius:8px;padding:8px 12px;font-size:13px}
  section{display:none} section.on{display:block}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:26px 0 10px;font-weight:600}
  h2:first-child{margin-top:0}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .charts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .card,.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .t{font-size:13px;color:var(--mute)}
  .card .v{font-size:30px;font-weight:700;margin:4px 0 6px;letter-spacing:-.02em}
  .card .f{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);gap:6px}
  .pill{border-radius:999px;padding:2px 9px;font-weight:600;font-size:11.5px;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
  .card.ok .v{color:var(--ok)} .card.bad .v{color:var(--bad)}
  .card.link{cursor:pointer} .card.link:hover{border-color:var(--brand)}
  .chart .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 14px;flex-wrap:wrap;margin-bottom:8px}
  .chart .ch .s{margin-bottom:0}
  .rng{width:190px;max-width:100%;user-select:none;-webkit-user-select:none}
  .rlab{font-size:12px;font-weight:600;color:var(--brand);text-align:right;margin-bottom:2px}
  .rtrack{position:relative;height:20px;touch-action:none;cursor:pointer}
  .rtrack::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:var(--line)}
  .rband{position:absolute;top:8px;height:4px;background:var(--brand-logo);border-radius:2px}
  .rh{position:absolute;top:3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid var(--brand-logo);cursor:ew-resize;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .rh:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .rext{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute)}
  .chart h3{font-size:14px;margin:0 0 2px;font-weight:600}
  .chart .s{font-size:12px;color:var(--mute);margin-bottom:10px}
  .chart .box{position:relative;height:250px}
  .chart.wide{grid-column:1/-1}
  .vazio{height:100%;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
  .msg{padding:40px;text-align:center;color:var(--mute)}
  @media(max-width:600px){.charts{grid-template-columns:1fr}.card .v{font-size:26px}}
</style>
</head>

<script>
/* ========= CONFIGURAÇÃO ========= */
const SUPABASE_URL = 'https://xnpufgzqlpmmtznifcxc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_keqioAwiHPxCtIfBsTqteg_ElLaqSYe';  // chave publishable (somente leitura via RLS)
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbyvqAEB0qmMqyk3LSNUbWeyiXU-wDxjWSfDF2FLiyNamG7hfwdNsP3UwMon6sQdaYCFRw/exec';           // URL do Web App do Apps Script (termina em /exec) - botão "Sincronizar agora"
const SYNC_TOKEN = 'triartpwr26';         // opcional: mesmo valor da propriedade SYNC_TOKEN do script
const TABELAS = {            // uma tabela por CSV
  taxa:     'comercial_1_taxa_de_conversao_de_leads',
  props:    'comercial_2_volume_de_propostas_enviadas',
  tempo:    'comercial_3_tempo_medio_de_fechamento',
  almox:    'producao_almoxarifado_acuracidade',
  eletrico: 'producao_eletrico_acuracidade',
  perdas:   'producao_perdas_e_extravios',
  perfil:   'producao_perfil_acuracidade',
  sodem:    'producao_sodem_acuracidade',
  vidros:   'producao_vidros_acuracidade',
  projetos: 'projetos_indicadores',
  turnover: 'rh_1_taxa_de_turnover',
  absent:   'rh_2_taxa_de_absentismo',
  feedback: 'rh_3_avaliacao_de_feedbacks',
  pco:      'rh_4_avaliacao_pco_e_nps',
};
/* ================================= */

const COR = {brand:'#1ba089', meta:'#8b9090', soft:'#cdeee7'};   // verde da logomarca Triart
const M3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const hoje = new Date();
const ANO = hoje.getFullYear();
const p2 = n=>String(n).padStart(2,'0');
const MES_HOJE = `${ANO}-${p2(hoje.getMonth()+1)}`;   // meses até hoje sem dado ficam zerados; depois, vazios
// Seleção do usuário: mês de referência dos cards. O período de cada gráfico temporal tem faixa própria (RANGE).
const SEL = {ano:ANO, mes:hoje.getMonth()+1};
let MES_REF = MES_HOJE, DOMAIN = [];   // DOMAIN = todos os meses disponíveis para as faixas
const RANGE = {};   // período escolhido em cada gráfico: id -> {de:'AAAA-MM', ate:'AAAA-MM'}
const TEMP = {};    // definição dos gráficos temporais: id -> {tipo, map, opts}
function listaMeses(de,ate){
  const o=[]; let [y,m]=de.split('-').map(Number); const [y2,m2]=ate.split('-').map(Number);
  while(y*12+m<=y2*12+m2 && o.length<120){ o.push(`${y}-${p2(m)}`); if(++m>12){m=1;y++} }
  return o;
}
function aplicaSel(){ MES_REF=`${SEL.ano}-${p2(SEL.mes)}`; }
aplicaSel();
const nomeMes = k=>{const [y,m]=k.split('-');return `${M3[+m-1]}/${y.slice(2)}`};
const nomeMesLongo = k=>{const [y,m]=k.split('-');return `${M3[+m-1]}/${y}`};

/* ---------- leitura e normalização ---------- */
const semAcento = s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const nk = k=>semAcento(k).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const norm = rows=>rows.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[nk(k),v])));

async function carrega(nome){
  const {data,error}=await sb.from(nome).select('*').limit(1000);
  if(error) throw new Error(`${nome} (${error.message})`);
  return norm(data);
}
// números em formatos mistos: "100,0%", "1.3%", "14.500,00", "1.722", 95
function pnum(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return v;
  let s=String(v).replace('%','').replace(/\s/g,'');
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isNaN(n)?null:n;
}
const lab = r=>String(r.mes_de_referencia??r.mes??r.evento??r.ano??r.semestre??r.indicador??'');
// "Jan/2026", "Janeiro/2026", "jan./26" -> "2026-01"; linhas de total/média -> null
function parseMes(l){
  const m=semAcento(l).toLowerCase().match(/^([a-z]{3})[a-z]*\.?\s*\/?\s*(\d{2,4})$/);
  if(!m) return null; const i=M3.indexOf(m[1]); if(i<0) return null;
  return `${m[2].length===2?'20'+m[2]:m[2]}-${String(i+1).padStart(2,'0')}`;
}
const porMes=(rows,fn)=>{const o={};rows.forEach(r=>{const k=parseMes(lab(r));if(k)o[k]=fn(r)});return o};
// meses até o atual sem dado ficam zerados; meses futuros ficam vazios
const serieAno=(map,meses)=>meses.map(k=>k<=MES_HOJE?(map[k]??0):(map[k]??null));
const eventos=(rows,fn)=>rows.map(r=>({n:(lab(r).match(/^evento\s*(\d+)/i)||[])[1],v:fn(r)}))
  .filter(e=>e.n).sort((a,b)=>a.n-b.n).map(e=>({l:'Ev. '+e.n,v:e.v}));
const ratio=(a,b)=>(a!==null&&b)?a/b*100:null;
const linhaMedia=rows=>rows.find(r=>/media/i.test(semAcento(lab(r))));

// valor do mês atual; sem dado no mês, fica zerado
function atualMes(map){ return {v:map[MES_REF]??0}; }
function ultimoEvento(ev){
  const c=ev.filter(e=>e.v!==null); return c.length?{v:c.at(-1).v,ref:'último: '+c.at(-1).l}:{v:0};
}
/* ---------- formatação e componentes ---------- */
const fmt=(v,d=1)=>v===null||v===undefined?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v===null||v===undefined?'—':fmt(v,d)+'%';
const P=v=>fmt(v,1)+'%';
const okGe=(v,m)=>v===null||v===undefined?null:v>=m, okLe=(v,m)=>v===null||v===undefined?null:v<=m;

function card({t,v,goal,ok,ref,link,sub}){
  const cls=ok===null||ok===undefined?'':(ok?'ok':'bad');
  const nota=[sub||goal||'',ref?`ref. ${ref}`:''].filter(Boolean).join(' · ');
  return `<div class="card ${cls} ${link?'link':''}" ${link?`data-go="${link}"`:''}>
    <div class="t">${t}</div><div class="v">${v}</div>
    <div class="f"><span>${nota}</span>${cls?`<span class="pill ${cls}">${ok?'na meta':'fora da meta'}</span>`:''}</div></div>`;
}
function chartBox(id,titulo,sub,wide,temporal){return `<div class="chart ${wide?'wide':''}"><div class="ch"><div><h3>${titulo}</h3><div class="s">${sub||''}</div></div>${temporal?`<div class="rng" data-c="${id}"></div>`:''}</div><div class="box" id="box_${id}"><canvas id="${id}"></canvas></div></div>`}

const charts=[];
function grafico(id,tipo,labels,data,{label='Valor',meta,fmtY=v=>v,min,max}={}){
  if(!data.some(v=>v!==null&&v!==undefined)){
    document.getElementById('box_'+id).innerHTML='<div class="vazio">Sem dados lançados</div>';return;
  }
  const ds=[tipo==='bar'
    ?{label,data,backgroundColor:COR.brand,borderRadius:4,maxBarThickness:38}
    :{label,data,borderColor:COR.brand,backgroundColor:COR.brand,tension:.3,pointRadius:3.5,pointHoverRadius:5,borderWidth:2.2,spanGaps:true}];
  if(meta!==undefined) ds.push({type:'line',label:'Meta',data:labels.map(()=>meta),borderColor:COR.meta,borderDash:[6,5],borderWidth:1.5,pointRadius:0,pointHoverRadius:0});
  charts.push(new Chart(document.getElementById(id),{type:tipo,data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:meta!==undefined,labels:{boxWidth:14,filter:i=>i.text==='Meta'}},
               tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmtY(c.parsed.y)}`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#6b7685'}},
              y:{min,max,grid:{color:'#eef0f3'},ticks:{color:'#6b7685',callback:fmtY},beginAtZero:tipo==='bar'}}}}));
}

/* ---------- dados de demonstração (mesmo formato dos CSVs) ---------- */
function demo(){
  const R=(a,b)=>a+Math.random()*(b-a), meses=M3.map(m=>m[0].toUpperCase()+m.slice(1)+'/'+ANO);
  const ate=meses.slice(0,hoje.getMonth()+1);
  const D={};
  D.taxa=ate.map(m=>{const l=Math.round(R(30,60));return{'Mês de Referência':m,'Leads Recebidos':l,'Leads Convertidos':Math.round(l*R(.6,.85))}});
  D.props=ate.map(m=>({'Mês de Referência':m,'Propostas Enviadas':Math.round(R(20,50))}));
  D.tempo=ate.map(m=>({'Mês de Referência':m,'Tempo Médio (dias)':Math.round(R(8,22))}));
  const mensal=(a,b)=>ate.map(m=>({'Mês':m,'Realizado':R(a,b).toFixed(1)+'%'}));
  D.almox=mensal(91,99); D.sodem=mensal(92,99.5);
  const evs=(a,b,n)=>[...Array(n)].map((_,i)=>({Evento:'Evento '+(i+1),Realizado:i<8?R(a,b).toFixed(1)+'%':null}));
  D.eletrico=evs(92,99.5,15); D.perdas=[...evs(1,7,15),{Evento:'Média Anual',Realizado:'3.6%'}];
  D.perfil=[{Ano:'Ano '+ANO,Realizado:'96.2%'}];
  D.vidros=[{Semestre:'1º Semestre (Jan-Jun)/'+ANO,Realizado:'93.5%'},{Semestre:'2º Semestre (Jul-Dez)/'+ANO,Realizado:null}];
  D.projetos=ate.map(m=>{const s=Math.round(R(90,270));return{'Mês':m,'Solicitados':s,'Finalizados':Math.round(s*R(.8,.97)),'Alterações a Pedido do Cliente':Math.round(R(5,40))}});
  const rh=(a,b)=>ate.map(m=>({'Mês':m.toLowerCase().slice(0,3)+'./'+String(ANO).slice(2),'Realizado':R(a,b).toFixed(1)+'%'}));
  D.turnover=rh(1,6); D.absent=rh(1,5);
  D.feedback=[{Indicador:'% Líderes com Avaliação de Feedback Realizada','Média Anual':'95%'},{Indicador:'% Funcionários com Avaliação de Feedback Realizada','Média Anual':'100%'},{Indicador:'% média total','Média Anual':'98%'}];
  D.pco=[{Indicador:'PCO (Pesquisa de Clima Organizacional)',[ANO]:'70.28%'},{Indicador:'eNPS (Net Promoter Score Interno)',[ANO]:'90%'}];
  Object.keys(D).forEach(k=>D[k]=norm(D[k]));
  return D;
}

/* ---------- montagem das abas ---------- */
function render(D){
  const ys=[...new Set([ANO,SEL.ano,...anosDosDados(D)])];
  DOMAIN=listaMeses(`${Math.min(...ys)}-01`,`${Math.max(...ys)}-12`);
  document.getElementById('refMes').textContent=nomeMesLongo(MES_REF);
  /* Comercial */
  const taxaMap=porMes(D.taxa,r=>pnum(r.taxa_de_conversao)??ratio(pnum(r.leads_convertidos),pnum(r.leads_recebidos)));
  const propsMap=porMes(D.props,r=>pnum(r.propostas_enviadas));
  const tempoMap=porMes(D.tempo,r=>pnum(r.tempo_medio_dias));
  const taxa=atualMes(taxaMap), props=atualMes(propsMap), tempo=atualMes(tempoMap);

  /* Projetos (totais sobre linhas mensais, sem a linha "Total") */
  const solMap=porMes(D.projetos,r=>pnum(r.solicitados)), finMap=porMes(D.projetos,r=>pnum(r.finalizados));
  const altMap=porMes(D.projetos,r=>pnum(r.alteracoes_a_pedido_do_cliente));
  const soma=m=>Object.values(m).reduce((a,v)=>a+(v||0),0);
  const totSol=soma(solMap), totFin=soma(finMap), pFin=totSol?totFin/totSol*100:0;
  const alt=atualMes(altMap);
  const pFinMap=Object.fromEntries(DOMAIN.map(k=>[k,ratio(finMap[k]??null,solMap[k]??null)]));

  /* Produção */
  const almoxMap=porMes(D.almox,r=>pnum(r.realizado)), sodemMap=porMes(D.sodem,r=>pnum(r.realizado));
  const almox=atualMes(almoxMap), sodem=atualMes(sodemMap);
  const evEle=eventos(D.eletrico,r=>pnum(r.realizado)), evPer=eventos(D.perdas,r=>pnum(r.realizado));
  const ele=ultimoEvento(evEle);
  const perfilLinha=D.perfil.find(r=>pnum(r.realizado)!==null);
  const perfil={v:perfilLinha?pnum(perfilLinha.realizado):0,ref:perfilLinha?'ano '+SEL.ano:undefined};
  const sem=D.vidros.filter(r=>/semestre/i.test(lab(r)));
  const semAt=sem[SEL.mes<=6?0:1], semAnt=sem.filter(r=>pnum(r.realizado)!==null).at(-1);
  const vidro=pnum(semAt?.realizado)!==null?{v:pnum(semAt.realizado)}:{v:semAnt?pnum(semAnt.realizado):0,ref:semAnt?lab(semAnt).match(/^\d/)[0]+'º semestre':undefined};
  const perdasMedia=pnum(linhaMedia(D.perdas)?.realizado);
  const perdasVals=evPer.map(e=>e.v).filter(v=>v!==null);
  const perdas=perdasMedia??(perdasVals.length?perdasVals.reduce((a,b)=>a+b,0)/perdasVals.length:0);

  /* RH */
  const turnMap=porMes(D.turnover,r=>pnum(r.realizado)), absMap=porMes(D.absent,r=>pnum(r.realizado));
  const turn=atualMes(turnMap), abs=atualMes(absMap);
  const fbLinhas=D.feedback.map(r=>({l:/lider/i.test(semAcento(lab(r)))?'Líderes':/funcion/i.test(semAcento(lab(r)))?'Funcionários':'Média total',v:pnum(r.media_anual)}));
  const fb=fbLinhas.find(x=>x.l==='Média total')?.v??0;
  const pcoLinha=D.pco.find(r=>/^pco/i.test(lab(r)));
  const anoCol=pcoLinha?Object.keys(pcoLinha).find(k=>/^\d{4}$/.test(k)):null;
  const pco=(pcoLinha&&anoCol?pnum(pcoLinha[anoCol]):null)??0;

  /* cards */
  const cTaxa =l=>card({t:'Taxa de conversão de leads',v:pct(taxa.v),goal:'Meta ≥ 70%',ok:okGe(taxa.v,70),ref:taxa.ref,link:l});
  const cProp =l=>card({t:'Propostas enviadas',v:props.v===null?'—':fmt(props.v,0),sub:'no mês',ref:props.ref,link:l});
  const cTempo=l=>card({t:'Tempo médio de fechamento',v:tempo.v===null?'—':fmt(tempo.v,0)+' dias',sub:'no mês',ref:tempo.ref,link:l});
  const cFin  =l=>card({t:'Projetos finalizados',v:pct(pFin),sub:`${fmt(totFin,0)} de ${fmt(totSol,0)} solicitados (total)`,link:l});
  const cAlt  =l=>card({t:'Projetos alterados',v:alt.v===null?'—':fmt(alt.v,0),sub:'no mês',ref:alt.ref,link:l});
  const ac=(n,x,l,g='Meta ≥ 95%')=>card({t:'Acuracidade '+n,v:pct(x.v),goal:g,ok:okGe(x.v,95),ref:x.ref,link:l});
  const cPerd =l=>card({t:'Perdas e extravios (média anual)',v:pct(perdas),goal:`Meta ≤ 5% · ${SEL.ano}`,ok:okLe(perdas,5),link:l});
  const cTurn =l=>card({t:'Taxa de turnover',v:pct(turn.v),goal:'Meta ≤ 5%',ok:okLe(turn.v,5),ref:turn.ref,link:l});
  const cAbs  =l=>card({t:'Taxa de absenteísmo',v:pct(abs.v),goal:'Meta ≤ 3%',ok:okLe(abs.v,3),ref:abs.ref,link:l});
  const cFb   =l=>card({t:'Feedbacks realizados (média)',v:pct(fb,0),goal:'Meta 100% · média anual',ok:okGe(fb,100),link:l});
  const cPco  =l=>card({t:'PCO – Clima organizacional',v:pct(pco,pco%1?2:0),goal:`Meta ≥ 80% · ${SEL.ano}`,ok:okGe(pco,80),link:l});
  const el=(id,h)=>document.getElementById(id).innerHTML=h;

  const blocoGeral=(a,h)=>pode(a)?`<h2>${ROTULO[a]}</h2><div class="grid">${h}</div>`:'';
  el('geral',
    blocoGeral('comercial',cTaxa('comercial')+cProp('comercial')+cTempo('comercial'))+
    blocoGeral('projetos',cFin('projetos')+cAlt('projetos'))+
    blocoGeral('producao',ac('Almoxarifado',almox,'producao')+cPerd('producao'))+
    blocoGeral('rh',cTurn('rh')+cAbs('rh')+cFb('rh')+cPco('rh'))
    || '<div class="msg">Nenhuma área foi liberada para o seu e-mail. Solicite acesso a um administrador.</div>');

  el('comercial',`
    <div class="grid">${cTaxa()}${cProp()}${cTempo()}</div><h2>Evolução</h2>
    <div class="charts">
      ${chartBox('c_taxa','Taxa de conversão de leads','Meta ≥ 70%',false,true)}
      ${chartBox('c_prop','Propostas enviadas','Volume por mês',false,true)}
      ${chartBox('c_tempo','Tempo médio de fechamento','Dias, por mês',false,true)}
    </div>`);
  graficoT('c_taxa','line',taxaMap,{label:'Conversão',meta:70,fmtY:P,min:0,max:100});
  graficoT('c_prop','bar',propsMap,{label:'Propostas',fmtY:v=>fmt(v,0)});
  graficoT('c_tempo','line',tempoMap,{label:'Dias',fmtY:v=>fmt(v,0)+' d',min:0});

  el('projetos',`
    <div class="grid">${cFin()}${cAlt()}</div><h2>Finalização de projetos</h2>
    <div class="charts">
      ${chartBox('p_pizza','Finalizados vs. solicitados','Todos os períodos')}
      ${chartBox('p_linha','% Finalizados / Solicitados','Evolução mensal',false,true)}
      ${chartBox('p_alt','Projetos alterados','Alterações a pedido do cliente, por mês',true,true)}
    </div>`);
  if(totSol) charts.push(new Chart(document.getElementById('p_pizza'),{type:'doughnut',
    data:{labels:['Finalizados','Em aberto'],datasets:[{data:[totFin,Math.max(totSol-totFin,0)],backgroundColor:[COR.brand,COR.soft],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'},
      tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.parsed,0)} (${fmt(c.parsed/totSol*100,1)}%)`}}}}}));
  else document.getElementById('box_p_pizza').innerHTML='<div class="vazio">Sem dados lançados</div>';
  graficoT('p_linha','line',pFinMap,{label:'% Finalizados',fmtY:P,min:0,max:100});
  graficoT('p_alt','bar',altMap,{label:'Alterados',fmtY:v=>fmt(v,0)});

  const cardsProd=`${ac('Almoxarifado',almox)}${ac('Vidro',vidro)}${ac('Sodem',sodem)}${ac('Perfil',perfil)}${ac('Elétrico',ele)}${cPerd()}`;
  el('producao',`
    <div class="grid">${cardsProd}</div><h2>Acuracidade de estoque · meta ≥ 95%</h2>
    <div class="charts">
      ${chartBox('a_almox','Acuracidade Almoxarifado','Por mês',false,true)}
      ${chartBox('a_vidro','Acuracidade Vidro','Por semestre')}
      ${chartBox('a_sodem','Acuracidade Sodem','Por mês',false,true)}

/* ---------- início ---------- */
async function obterDados(){
  if(!CONFIGURADO){ $('demo').hidden=false; return demo(); }
  const chaves=Object.keys(TABELAS), D={}, falhas=[];
  const buscar=chaves.filter(k=>pode(AREA_DE[k]));
  chaves.forEach(k=>{ D[k]=[]; });   // áreas sem permissão ficam vazias (e nem são consultadas)
  const res=await Promise.allSettled(buscar.map(k=>carrega(TABELAS[k])));
  res.forEach((r,i)=>{ if(r.status==='fulfilled') D[buscar[i]]=r.value; else falhas.push(r.reason.message); });
  if(buscar.length&&falhas.length===buscar.length) throw new Error(falhas[0]);
  $('aviso').innerHTML=falhas.length?`<div>Tabelas não carregadas: ${esc(falhas.join(', '))}</div>`:'';
  return D;
}let ULTIMO=null, ASSINATURA='';
function desenha(D){ ULTIMO=D; ASSINATURA=JSON.stringify(D);montaFiltros(D); charts.splice(0).forEach(c=>c.destroy()); render(D); }

// anos presentes nos dados; a lista do seletor inclui também ano anterior, atual e seguinte
function anosDosDados(D){
  const s=new Set(); Object.values(D).forEach(rows=>rows.forEach(r=>{const k=parseMes(lab(r)); if(k) s.add(+k.slice(0,4))}));
  return [...s];
}
function anosDisponiveis(D){ return [...new Set([ANO-1,ANO,ANO+1,SEL.ano,...anosDosDados(D)])].sort(); }
const fAno=document.getElementById('fAno'), fMes=document.getElementById('fMes');
function montaFiltros(D){
  fAno.innerHTML=anosDisponiveis(D).map(a=>`<option value="${a}">${a}</option>`).join('');
  sincronizaFiltros();
}
function sincronizaFiltros(){ fAno.value=SEL.ano; fMes.value=SEL.mes; }
const limpaRanges=()=>{ for(const k in RANGE) delete RANGE[k]; };
function refiltra(){ aplicaSel(); sincronizaFiltros(); if(ULTIMO){ charts.splice(0).forEach(c=>c.destroy()); render(ULTIMO); } }
fAno.onchange=()=>{ SEL.ano=+fAno.value; limpaRanges(); refiltra(); };   // novo ano: cada gráfico volta a jan–dez desse ano
fMes.onchange=()=>{ SEL.mes=+fMes.value; refiltra(); };
document.getElementById('fReset').onclick=()=>{ Object.assign(SEL,{ano:ANO,mes:hoje.getMonth()+1}); limpaRanges(); refiltra(); };

/* ---------- período de cada gráfico: faixa arrastável ---------- */
function idxRange(id){
  const n=DOMAIN.length, r=RANGE[id]||{de:`${SEL.ano}-01`,ate:`${SEL.ano}-12`};
  let a=DOMAIN.indexOf(r.de), b=DOMAIN.indexOf(r.ate);
  if(a<0) a=0; if(b<0) b=n-1;
  return a<=b?[a,b]:[b,a];
}
function graficoT(id,tipo,map,opts){ TEMP[id]={tipo,map,opts}; desenhaT(id,true); }
function desenhaT(id,recria){
  const {tipo,map,opts}=TEMP[id], [a,b]=idxRange(id), meses=DOMAIN.slice(a,b+1);
  const labels=meses.map(nomeMes), data=serieAno(map,meses);
  const ch=charts.find(c=>c.canvas&&c.canvas.id===id);
  if(!recria && ch && data.some(v=>v!==null)){   // atualiza no lugar, sem animar, durante o arraste
    ch.data.labels=labels;
    ch.data.datasets.forEach(ds=>{ ds.data=ds.label==='Meta'?labels.map(()=>opts.meta):data; });
    ch.update('none'); return;
  }
  if(ch){ ch.destroy(); charts.splice(charts.indexOf(ch),1); }
  document.getElementById('box_'+id).innerHTML=`<canvas id="${id}"></canvas>`;
  grafico(id,tipo,labels,data,opts);
}
function montaSliders(){ document.querySelectorAll('.rng[data-c]').forEach(el=>slider(el,el.dataset.c)); }
function slider(el,id){
  const n=DOMAIN.length, pos=i=>n>1?i/(n-1)*100:0;
  el.innerHTML=`<div class="rlab"></div><div class="rtrack"><div class="rband"></div>
    <div class="rh" data-h="a" tabindex="0" role="slider" aria-label="Início do período"></div>
    <div class="rh" data-h="b" tabindex="0" role="slider" aria-label="Fim do período"></div></div>
    <div class="rext"><span>${nomeMes(DOMAIN[0])}</span><span>${nomeMes(DOMAIN[n-1])}</span></div>`;
  const tr=el.querySelector('.rtrack'), band=el.querySelector('.rband'), ha=el.querySelector('[data-h=a]'), hb=el.querySelector('[data-h=b]'), rl=el.querySelector('.rlab');
  let [a,b]=idxRange(id), modo=null, off=0, span=0;
  const pinta=()=>{
    ha.style.left=pos(a)+'%'; hb.style.left=pos(b)+'%'; band.style.left=pos(a)+'%'; band.style.width=(pos(b)-pos(a))+'%';
    rl.textContent=a===b?nomeMes(DOMAIN[a]):`${nomeMes(DOMAIN[a])} – ${nomeMes(DOMAIN[b])}`;
    ha.setAttribute('aria-valuetext',nomeMes(DOMAIN[a])); hb.setAttribute('aria-valuetext',nomeMes(DOMAIN[b]));
  };
  const aplica=()=>{ RANGE[id]={de:DOMAIN[a],ate:DOMAIN[b]}; pinta(); desenhaT(id); };
  const idxDe=x=>{ const r=tr.getBoundingClientRect(); return Math.max(0,Math.min(n-1,Math.round((x-r.left)/r.width*(n-1)))); };
  const move=e=>{
    if(!modo) return; const i=idxDe(e.clientX), a0=a, b0=b;
    if(modo==='band'){ a=Math.max(0,Math.min(n-1-span,i-off)); b=a+span; }
    else if(modo==='a'){ if(i<=b) a=i; else { a=b; b=i; modo='b'; } }
    else { if(i>=a) b=i; else { b=a; a=i; modo='a'; } }
    if(a!==a0||b!==b0) aplica();
  };
  tr.addEventListener('pointerdown',e=>{
    const i=idxDe(e.clientX);
    if(e.target===ha) modo='a'; else if(e.target===hb) modo='b';
    else if(i>a&&i<b){ modo='band'; off=i-a; span=b-a; }        // arrastar a faixa inteira
    else modo=Math.abs(i-a)<=Math.abs(i-b)?'a':'b';             // clique: leva a ponta mais próxima
    tr.setPointerCapture(e.pointerId); move(e); e.preventDefault();
  });
  tr.addEventListener('pointermove',move);
  ['pointerup','pointercancel'].forEach(t=>tr.addEventListener(t,()=>{ modo=null; }));
  el.addEventListener('keydown',e=>{
    const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0; if(!d) return;
    if(e.target===ha) a=Math.max(0,Math.min(b,a+d)); else if(e.target===hb) b=Math.min(n-1,Math.max(a,b+d)); else return;
    e.preventDefault(); aplica();
  });
  pinta();
}

const stEl=document.getElementById('syncSt'), btn=document.getElementById('syncBtn');
const status=(t,cls='')=>{stEl.textContent=t;stEl.className='sync-st '+cls};
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

// Sheets -> Supabase (Apps Script) e depois Supabase -> tela
async function sincronizar(){
  if(!SYNC_URL){ status('Configure SYNC_URL no script do dashboard','err'); return; }
  btn.disabled=true; btn.classList.add('girando'); status('Sincronizando…');
  try{
    const r=await fetch(SYNC_URL+(SYNC_TOKEN?`?token=${encodeURIComponent(SYNC_TOKEN)}`:''));
    const j=await r.json();
    if(!j.ok) throw new Error(j.erro||'falha na sincronização');
    desenha(await obterDados());
    status(j.erros&&j.erros.length?`Atualizado às ${hhmm()} com ${j.erros.length} erro(s)`:`Atualizado às ${hhmm()}`, j.erros&&j.erros.length?'err':'ok');
  }catch(e){ status('Erro: '+e.message,'err'); }
  finally{ btn.disabled=false; btn.classList.remove('girando'); }
}
btn.addEventListener('click',sincronizar);

// Atualização automática: reconsulta o Supabase a cada minuto (aba visível) e ao voltar para a aba;
// só redesenha se algo mudou (novas linhas do Sheets aparecem sem recarregar a página).
const AUTO_REFRESH_MS=60000;
async function atualizaAuto(){
  if(document.hidden||!CONFIGURADO||!USER.email||btn.disabled) return;
  try{
    const D=await obterDados();
    if(JSON.stringify(D)!==ASSINATURA){ desenha(D); status(`Novos dados às ${hhmm()}`,'ok'); }
  }catch(e){ /* mantém a tela atual; tenta de novo no próximo ciclo */ }
}
setInterval(atualizaAuto,AUTO_REFRESH_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) atualizaAuto(); });

/* ---------- acesso: cadastro e login com e-mail + senha, permissões por área ---------- */
const AREAS=['comercial','projetos','producao','rh'];
const ROTULO={comercial:'Comercial',projetos:'Projetos',producao:'Produção',rh:'RH'};
const AREA_DE={taxa:'comercial',props:'comercial',tempo:'comercial',almox:'producao',eletrico:'producao',perdas:'producao',perfil:'producao',sodem:'producao',vidros:'producao',projetos:'projetos',turnover:'rh',absent:'rh',feedback:'rh',pco:'rh'};
const CONFIGURADO=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);
const sb=(CONFIGURADO&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let USER={email:'',admin:false,areas:[...AREAS]};   // modo demonstração: tudo liberado
const pode=a=>USER.areas.includes(a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const SENHA_MIN=8;

const CADEADO='<span class="cad" aria-label="Sem acesso"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>';

// áreas sem permissão: nenhum dado é mostrado, só o aviso de bloqueio
function bloqueiaAreas(){
  AREAS.forEach(a=>{
    if(pode(a)) return;
    const s=$(a);
    for(let i=charts.length-1;i>=0;i--) if(s.contains(charts[i].canvas)){ charts[i].destroy(); charts.splice(i,1); }
    s.innerHTML=`<div class="bloqueado"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <h3>Sem acesso a ${ROTULO[a]}</h3><p>Seu usuário não tem permissão para ver esta área. Solicite a liberação a um administrador.</p></div>`;
  });
}

function aplicaPermissoes(){
  AREAS.forEach(a=>{
    const b=document.querySelector(`#nav [data-tab="${a}"]`); if(!b) return;
    b.hidden=false; b.classList.toggle('lock',!pode(a));

  });
  $('navAcessos').hidden=!USER.admin;

  $('quem').textContent=USER.email; $('sairBtn').hidden=!USER.email;
  ir('geral');
}

/* --- tela de login / cadastro --- */
const lgMsg=(t,cls='err')=>{ $('lgMsg').textContent=t||''; $('lgMsg').className='lg-msg '+cls; };
const lgPasso=p=>['lgCarregando','lgForm','lgPendente'].forEach(id=>{ $(id).hidden=(id!==p); });
const lgOcupado=b=>document.querySelectorAll('#login button,#login input').forEach(e=>{ e.disabled=b; });
let MODO='entrar';
function lgModo(m){
  MODO=m; lgMsg('');
  $('tabEntrar').classList.toggle('on',m==='entrar'); $('tabCadastro').classList.toggle('on',m==='cadastro');
  $('lgSenha2').hidden=(m!=='cadastro');
  $('lgSenha2').required=(m==='cadastro');
  $('lgSenha').autocomplete=m==='cadastro'?'new-password':'current-password';
  $('lgOk').textContent=m==='cadastro'?'Criar conta':'Entrar';
  $('lgDica').textContent=m==='cadastro'
    ?`Crie sua conta com e-mail e uma senha de pelo menos ${SENHA_MIN} caracteres. Depois, um administrador libera as áreas que você poderá ver.`
    :'Entre com seu e-mail e senha.';
}
function mostraLogin(msg,cls){
  document.body.classList.add('bloq'); lgPasso('lgForm'); lgModo('entrar'); lgMsg(msg||'',cls||'err'); $('lgEmailIn').focus();
}
function mostraPendente(email){
  document.body.classList.add('bloq'); lgPasso('lgPendente'); $('lgPendEmail').textContent=email; lgMsg('');
}
const traduzErro=m=>{
  m=String(m||'');
  if(/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/already registered|already been registered/i.test(m)) return 'Este e-mail já está cadastrado. Use a aba "Entrar".';
  if(/password should be at least|weak/i.test(m)) return `A senha deve ter pelo menos ${SENHA_MIN} caracteres.`;
  if(/rate limit|too many/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Peça a um administrador para verificar as configurações do Supabase.';
  return m;
};
$('tabEntrar').addEventListener('click',()=>lgModo('entrar'));
$('tabCadastro').addEventListener('click',()=>lgModo('cadastro'));
$('lgForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('lgEmailIn').value.trim().toLowerCase(), senha=$('lgSenha').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ lgMsg('Informe um e-mail válido.'); return; }
  if(MODO==='cadastro'){
    if(senha.length<SENHA_MIN){ lgMsg(`A senha deve ter pelo menos ${SENHA_MIN} caracteres.`); return; }
    if(senha!==$('lgSenha2').value){ lgMsg('As senhas não conferem.'); return; }
  }
  lgOcupado(true); lgMsg('');
  try{
    const r=MODO==='cadastro'?await sb.auth.signUp({email,password:senha}):await sb.auth.signInWithPassword({email,password:senha});
    if(r.error){ lgMsg(traduzErro(r.error.message)); return; }
    if(!r.data.session){ lgMsg('Conta criada, mas o Supabase ainda exige confirmação por e-mail. Desative "Confirm email" em Authentication > Providers > Email.'); return; }
    $('lgSenha').value=''; $('lgSenha2').value='';
    await entrar(r.data.session);
  }catch(err){ lgMsg('Erro: '+traduzErro(err.message||err)); }
  finally{ lgOcupado(false); }
});
const sair=async()=>{ await sb.auth.signOut(); location.reload(); };
$('sairBtn').addEventListener('click',sair);
$('lgSair').addEventListener('click',sair);
$('lgRecheca').addEventListener('click',async()=>{
  const {data:{session}}=await sb.auth.getSession(); if(session) await entrar(session); else mostraLogin();
});

// lê as permissões do usuário logado (a tabela só devolve a própria linha, ou todas se for admin)
async function entrar(session){
  const {data,error}=await sb.from('acessos').select('email,areas,admin').eq('user_id',session.user.id).maybeSingle();
  const email=(session.user.email||'').toLowerCase();
  if(error){ await sb.auth.signOut(); mostraLogin('Não foi possível verificar seu acesso: '+traduzErro(error.message)); return; }
  const areas=!data?[]:data.admin?[...AREAS]:(data.areas||[]).filter(a=>AREAS.includes(a));
  if(!areas.length){ USER={email:'',admin:false,areas:[]}; mostraPendente(email); return; }   // conta criada, aguardando liberação
  USER={email,admin:!!data.admin,areas};
  document.body.classList.remove('bloq'); aplicaPermissoes();
  try{ desenha(await obterDados()); }
  catch(e){ document.querySelector('main').innerHTML=`<div class="msg">Não foi possível carregar os dados do Supabase.<br><small>${esc(e.message)}</small></div>`; }
  if(USER.admin) atualizaPendentes();
}

/* --- painel do administrador: usuários e permissões --- */
const pendente=r=>!r.admin&&!(r.areas||[]).length;
async function atualizaPendentes(lista){
  if(!lista){ const {data}=await sb.from('acessos').select('areas,admin'); lista=data||[]; }
  const n=lista.filter(pendente).length;
  $('lblAcessos').textContent=n?`Acessos (${n})`:'Acessos';
}
async function carregaAcessos(){
  const box=$('acessos'); box.innerHTML='<div class="msg">Carregando…</div>';
  const {data,error}=await sb.from('acessos').select('*').order('email');
  if(error){ box.innerHTML=`<div class="msg">Não foi possível carregar os usuários.<br><small>${esc(error.message)}</small></div>`; return; }
  data.sort((a,b)=>(pendente(b)-pendente(a))||a.email.localeCompare(b.email));   // pendentes primeiro
  atualizaPendentes(data);
  const cab=AREAS.map(a=>`<th>${ROTULO[a]}</th>`).join('');
  const linhas=data.map(r=>`<tr data-u="${esc(r.user_id)}" data-e="${esc(r.email)}" class="${pendente(r)?'pend':''}">
    <td>${esc(r.email)}${r.admin?' <span class="tag">admin</span>':pendente(r)?' <span class="tag pend">pendente</span>':''}</td>
    ${AREAS.map(a=>`<td><input type="checkbox" data-a="${a}" ${(r.admin||(r.areas||[]).includes(a))?'checked':''} ${r.admin?'disabled':''} aria-label="${ROTULO[a]}"></td>`).join('')}
    <td class="acoes">${r.admin?'':'<button type="button" class="sen">Redefinir senha</button> <button type="button" class="rm">Excluir</button>'}</td></tr>`).join('');
  box.innerHTML=`<div class="ac">
    <h2>Usuários e permissões</h2>
    <p class="hint">Quem cria uma conta na tela de login aparece aqui como <b>pendente</b>, sem ver nada. Marque as áreas que cada pessoa pode visualizar. Administradores veem tudo. As mudanças valem no próximo carregamento do dashboard da pessoa.</p>
    <div class="tw"><table><thead><tr><th>E-mail</th>${cab}<th></th></tr></thead><tbody>${linhas}</tbody></table></div>
    <div id="acSt" class="ac-st"></div></div>`;
}
const acSt=(t,cls='')=>{ const e=$('acSt'); if(e){ e.textContent=t; e.className='ac-st '+cls; } };
$('acessos').addEventListener('change',async e=>{
  const cb=e.target.closest('input[data-a]'); if(!cb) return;
  const tr=cb.closest('tr'), areas=[...tr.querySelectorAll('input[data-a]:checked')].map(i=>i.dataset.a);
  const {error}=await sb.from('acessos').update({areas}).eq('user_id',tr.dataset.u);
  if(error){ cb.checked=!cb.checked; acSt('Erro ao salvar: '+error.message,'err'); return; }
  acSt(`Salvo: ${tr.dataset.e}`,'ok');
  tr.classList.toggle('pend',!areas.length);
  const t=tr.querySelector('td'); t.querySelector('.tag')?.remove();
  if(!areas.length) t.insertAdjacentHTML('beforeend',' <span class="tag pend">pendente</span>');
  atualizaPendentes();
});
$('acessos').addEventListener('click',async e=>{
  const tr=e.target.closest('tr'); if(!tr) return; const em=tr.dataset.e, uid=tr.dataset.u;
  if(e.target.closest('.rm')){
    if(!confirm(`Excluir a conta de ${em}? A pessoa perde o acesso e precisará se cadastrar de novo.`)) return;
    const {error}=await sb.rpc('admin_excluir_usuario',{p_user:uid});
    if(error) acSt('Erro ao excluir: '+error.message,'err'); else { await carregaAcessos(); acSt(`Conta excluída: ${em}`,'ok'); }
  }else if(e.target.closest('.sen')){
    const nova=prompt(`Nova senha para ${em} (mínimo ${SENHA_MIN} caracteres).\nInforme a senha à pessoa por um canal seguro.`);
    if(nova===null) return;
    if(nova.length<SENHA_MIN){ acSt(`A senha deve ter pelo menos ${SENHA_MIN} caracteres.`,'err'); return; }
    const {error}=await sb.rpc('admin_definir_senha',{p_user:uid,p_senha:nova});
    if(error) acSt('Erro ao redefinir: '+error.message,'err'); else acSt(`Senha redefinida para ${em}. A pessoa precisará entrar de novo.`,'ok');
  }
});

(async function(){
  if(!CONFIGURADO){   // sem Supabase configurado: demonstração, sem login
    document.body.classList.remove('bloq'); aplicaPermissoes();
    try{ desenha(await obterDados()); }catch(e){ document.querySelector('main').innerHTML=`<div class="msg">${esc(e.message)}</div>`; }
    return;
  }
  if(!sb){ document.body.classList.add('bloq'); lgPasso('lgForm'); lgMsg('Não foi possível carregar o componente de autenticação. Verifique a conexão e recarregue a página.'); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(session) await entrar(session); else mostraLogin();
})();
</script>
